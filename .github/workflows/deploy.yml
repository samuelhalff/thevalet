name: Build and deploy

# DISABLED (2026-10-26): hosting for thevalet.ch is not decided yet (awaiting the SSH host).
# Only manual runs are possible; push and schedule triggers are removed on purpose. When the host
# is known, replace the FTPS step with the SSH deploy and re-add `push: branches: [main]`.
# No secrets live in this repository: they are GitHub secrets / variables.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://thevalet.ch' }}
      # Keep "true" until HTTPS is live (noindex + robots Disallow).
      NEXT_PUBLIC_NOINDEX: ${{ vars.NEXT_PUBLIC_NOINDEX || 'true' }}
      NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
      NEXT_PUBLIC_FORMSPARK_ID: ${{ vars.NEXT_PUBLIC_FORMSPARK_ID || secrets.NEXT_PUBLIC_FORMSPARK_ID }}
      NEXT_PUBLIC_WHATSAPP: ${{ vars.NEXT_PUBLIC_WHATSAPP || secrets.NEXT_PUBLIC_WHATSAPP }}
      NEXT_PUBLIC_CONTACT_PHONE: ${{ vars.NEXT_PUBLIC_CONTACT_PHONE }}
      NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
      NEXT_PUBLIC_COMPANY_NAME: ${{ vars.NEXT_PUBLIC_COMPANY_NAME }}
      NEXT_PUBLIC_COMPANY_UID: ${{ vars.NEXT_PUBLIC_COMPANY_UID }}
      NEXT_PUBLIC_COMPANY_STREET: ${{ vars.NEXT_PUBLIC_COMPANY_STREET }}
      NEXT_PUBLIC_COMPANY_POSTCODE: ${{ vars.NEXT_PUBLIC_COMPANY_POSTCODE }}
      NEXT_PUBLIC_COMPANY_CITY: ${{ vars.NEXT_PUBLIC_COMPANY_CITY }}
      NEXT_PUBLIC_COMPANY_RESPONSIBLE: ${{ vars.NEXT_PUBLIC_COMPANY_RESPONSIBLE }}
      NEXT_PUBLIC_HOSTING_PROVIDER: ${{ vars.NEXT_PUBLIC_HOSTING_PROVIDER }}
      NEXT_PUBLIC_SAME_AS: ${{ vars.NEXT_PUBLIC_SAME_AS }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Deploy script tests
        run: for f in scripts/tests/test_*.py; do python3 "$f"; done
      - run: npm run build # prebuild runs scripts/validate-content.mjs

      - name: Check export
        run: |
          test -f out/fr/index.html
          test -f out/en/index.html
          test -f out/404.html
          test -f out/.htaccess

      - name: Deploy over FTPS (explicit TLS, incremental, per-file atomic swap)
        env:
          DEPLOY_HOST: ${{ secrets.FTP_HOST }}
          DEPLOY_PORT: ${{ secrets.FTP_PORT }}
          DEPLOY_USER: ${{ secrets.FTP_USER }}
          DEPLOY_PASS: ${{ secrets.FTP_PASS }}
          # Web root relative to the FTP login directory (repo variable; default: the login directory).
          DEPLOY_DIR: ${{ vars.FTP_DIR || '.' }}
        run: |
          # scripts/deploy-ftp.py uploads only files whose sha256 changed since the manifest on the
          # server, swaps pages in via tmp + rename (never a missing page), and deletes only files
          # listed in its previous manifest. Protected paths (_archive-*, .ftpquota, .well-known,
          # cgi-bin) are asserted before every write and abort the run if ever hit.
          # 1) Plan only (read-only: fetches the manifest), logged for the run record.
          python3 scripts/deploy-ftp.py --dry-run
          # 2) Real deploy.
          python3 scripts/deploy-ftp.py

      - name: Smoke test (HTTPS, redirects)
        run: |
          set -u
          base="${NEXT_PUBLIC_SITE_URL}"
          fail=0
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$1")
            if [ "$code" = "$2" ]; then echo "OK   $1 → $code"; else echo "FAIL $1 → $code (expected $2)"; fail=1; fi
          }
          sleep 5
          check "$base/fr/" 200
          check "$base/en/" 200
          check "$base/.deploy-manifest.json" 403
          exit $fail
