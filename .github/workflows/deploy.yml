name: Build and deploy

# Pull requests: lint, typecheck, tests and build (required check before merging into main).
# Push to main (= a merged PR): the same checks, then rsync of out/ over SSH to the web root.
# The deploy steps are skipped until the DEPLOY_SSH_* secrets exist (production host pending).
# No secrets live in this repository: they are GitHub secrets / variables.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://thevalet.ch' }}
      # Keep "true" until HTTPS is live (noindex + robots Disallow).
      NEXT_PUBLIC_NOINDEX: ${{ vars.NEXT_PUBLIC_NOINDEX || 'true' }}
      NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
      NEXT_PUBLIC_FORMSPARK_ID: ${{ vars.NEXT_PUBLIC_FORMSPARK_ID || secrets.NEXT_PUBLIC_FORMSPARK_ID }}
      NEXT_PUBLIC_WHATSAPP: ${{ vars.NEXT_PUBLIC_WHATSAPP || secrets.NEXT_PUBLIC_WHATSAPP }}
      NEXT_PUBLIC_CONTACT_PHONE: ${{ vars.NEXT_PUBLIC_CONTACT_PHONE }}
      NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
      NEXT_PUBLIC_COMPANY_NAME: ${{ vars.NEXT_PUBLIC_COMPANY_NAME }}
      NEXT_PUBLIC_COMPANY_UID: ${{ vars.NEXT_PUBLIC_COMPANY_UID }}
      NEXT_PUBLIC_COMPANY_STREET: ${{ vars.NEXT_PUBLIC_COMPANY_STREET }}
      NEXT_PUBLIC_COMPANY_POSTCODE: ${{ vars.NEXT_PUBLIC_COMPANY_POSTCODE }}
      NEXT_PUBLIC_COMPANY_CITY: ${{ vars.NEXT_PUBLIC_COMPANY_CITY }}
      NEXT_PUBLIC_COMPANY_RESPONSIBLE: ${{ vars.NEXT_PUBLIC_COMPANY_RESPONSIBLE }}
      NEXT_PUBLIC_HOSTING_PROVIDER: ${{ vars.NEXT_PUBLIC_HOSTING_PROVIDER }}
      NEXT_PUBLIC_SAME_AS: ${{ vars.NEXT_PUBLIC_SAME_AS }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Deploy script tests
        run: for f in scripts/tests/test_*.py; do python3 "$f"; done
      - run: npm run build # prebuild runs scripts/validate-content.mjs

      - name: Check export
        run: |
          test -f out/fr/index.html
          test -f out/en/index.html
          test -f out/404.html
          test -f out/.htaccess

      - name: Is a production host configured?
        id: target
        if: github.event_name != 'pull_request'
        env:
          HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -n "$HOST" ] && [ -n "$DEPLOY_PATH" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::DEPLOY_SSH_HOST / DEPLOY_PATH not set: build checked, nothing deployed."; fi

      - name: Deploy over SSH (rsync)
        if: steps.target.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          USER: ${{ secrets.DEPLOY_SSH_USER }}
          PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # --delete only inside DEPLOY_PATH; certificates and host files are never touched.
          rsync -az --delete --checksum \
            --exclude '.well-known/' --exclude 'cgi-bin/' --exclude '_archive-*' \
            -e "ssh -i ~/.ssh/deploy -p ${PORT:-22} -o StrictHostKeyChecking=accept-new" \
            out/ "$USER@$HOST:$DEPLOY_PATH/"

      - name: Smoke test (straight to the server, works before DNS and HTTPS)
        if: steps.target.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          set -u
          fail=0
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -H 'Host: thevalet.ch' "http://$HOST$1")
            case "$code" in $2) echo "OK   $1 → $code" ;; *) echo "FAIL $1 → $code (expected $2)"; fail=1 ;; esac
          }
          check /fr/ '200|301'
          check /en/ '200|301'
          check /images/alps.webp '200|301'
          exit $fail
