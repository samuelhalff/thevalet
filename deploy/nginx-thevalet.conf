# nginx site for thevalet.ch (static Next.js export). Mirrors public/.htaccess.
# Installed at /etc/nginx/sites-available/thevalet (headers: snippets/thevalet-headers.conf) by
# deploy/setup-vps.sh; certbot adds the HTTPS server and the HTTP → HTTPS redirect once DNS
# points here.

map $http_accept_language $thevalet_home {
    default /fr/;
    ~*^\s*en /en/;
}

server {
    listen 80;
    listen [::]:80;
    server_name thevalet.ch www.thevalet.ch;

    root /var/www/thevalet;
    index index.html;
    charset utf-8;
    autoindex off;

    # www → apex (kept for HTTPS by certbot's copy of this block).
    if ($host = www.thevalet.ch) {
        return 301 $scheme://thevalet.ch$request_uri;
    }

    include snippets/thevalet-headers.conf;

    gzip on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    error_page 404 /404.html;

    # Root: language by Accept-Language, like the Apache rule.
    location = / {
        add_header Vary "Accept-Language" always;
        include snippets/thevalet-headers.conf;
        return 302 $thevalet_home;
    }

    # Deploy bookkeeping files and dotfiles (except ACME challenges) are never served.
    location ~ /\.(?!well-known/) { deny all; }
    location ~ (^/\.deploy-|\.deploy-tmp$) { deny all; }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/thevalet-headers.conf;
        try_files $uri =404;
    }

    location ~* \.(webp|avif|jpe?g|png|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
        include snippets/thevalet-headers.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        include snippets/thevalet-headers.conf;
        try_files $uri $uri.html $uri/ =404;
    }
}
